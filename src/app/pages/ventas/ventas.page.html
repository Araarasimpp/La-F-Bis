<ion-content>
  <div class="fb-page pos">

    <div class="pos-main">

      <header class="fb-header">
        <div>
          <h1 class="fb-title">Vender</h1>
          <span class="fb-sub">Toca un producto para agregarlo o usa el lector de códigos</span>
        </div>
      </header>

      <label class="fb-search">
        <ion-icon name="search-outline" aria-hidden="true"></ion-icon>
        <span class="fb-sr">Buscar producto</span>
        <input
          type="search"
          placeholder="Nombre, código, marca o moto"
          [(ngModel)]="busqueda">
        <button
          *ngIf="busqueda"
          type="button"
          class="fb-icon-btn plain sm"
          (click)="busqueda = ''"
          aria-label="Borrar búsqueda">
          <ion-icon name="close-outline"></ion-icon>
        </button>
      </label>

      <span class="count">{{ productosFiltrados.length }} productos</span>

      <div class="fb-loading" *ngIf="cargando">
        <ion-spinner name="crescent"></ion-spinner>
      </div>

      <div class="list" *ngIf="!cargando">
        <button
          type="button"
          class="item"
          *ngFor="let p of productosFiltrados; trackBy: trackId"
          [class.agotado]="p.stock <= 0"
          [class.en-carrito]="cantidadEnCarrito(p) > 0"
          [disabled]="p.stock <= 0"
          (click)="agregarAlCarrito(p)"
          [attr.aria-label]="'Agregar ' + p.elemento + ' al carrito'">

          <span class="fb-thumb">
            <img *ngIf="p.imagen_url; else sinFoto" [src]="p.imagen_url" alt="" loading="lazy">
            <ng-template #sinFoto><ion-icon name="cube-outline"></ion-icon></ng-template>
          </span>

          <span class="info">
            <span class="name">{{ p.elemento }}</span>
            <span class="meta fb-mono">
              {{ p.numero_inventario || p.codigo }}<ng-container *ngIf="p.ubicacion"> · {{ p.ubicacion }}</ng-container>
            </span>
            <span class="meta" *ngIf="p.marca || p.moto">
              {{ p.marca }}<ng-container *ngIf="p.marca && p.moto"> · </ng-container>{{ p.moto }}
            </span>
            <span class="bottom">
              <span class="price fb-money">$ {{ p.precio | number:'1.0-0' }}</span>
              <span class="fb-pill warn" *ngIf="p.stock <= 0">Agotado</span>
              <span class="fb-pill warn" *ngIf="p.stock > 0 && p.stock < 5">Quedan {{ p.stock }}</span>
              <span class="fb-pill" *ngIf="p.stock >= 5">Stock {{ p.stock }}</span>
            </span>
          </span>

          <span class="add" aria-hidden="true">
            <span *ngIf="cantidadEnCarrito(p) > 0; else mas" class="fb-money">{{ cantidadEnCarrito(p) }}</span>
            <ng-template #mas><ion-icon name="add-outline"></ion-icon></ng-template>
          </span>
        </button>

        <div class="fb-empty" *ngIf="!productosFiltrados.length">
          <ion-icon name="search-outline"></ion-icon>
          <strong>Sin resultados</strong>
          <span>Prueba con otra palabra o con el código del producto.</span>
        </div>
      </div>
    </div>

    <!-- En pantallas grandes el carrito queda fijo a la derecha -->
    <aside class="pos-cart" aria-label="Carrito">
      <app-carrito-modal [ventas]="this" [inline]="true"></app-carrito-modal>
    </aside>

  </div>
</ion-content>
