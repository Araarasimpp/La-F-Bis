<ion-content>
  <main class="auth">

    <div class="stripe" aria-hidden="true"></div>

    <section class="brand">
      <span class="fb-eyebrow">Repuestos · Taller</span>
      <h1>Crear<br>cuenta</h1>
      <p>Las cuentas nuevas entran como vendedor. Un administrador puede cambiar el rol después.</p>
    </section>

    <div class="form" *ngIf="listo">
      <p class="ok" role="status">
        <ion-icon name="checkmark-outline" aria-hidden="true"></ion-icon>
        Cuenta creada. Ya puedes iniciar sesión.
      </p>
      <button type="button" class="fb-btn primary big block" (click)="goLogin()">Ir a iniciar sesión</button>
    </div>

    <form class="form" *ngIf="!listo" (ngSubmit)="register()" novalidate>

      <label class="fb-field">
        <span>Correo</span>
        <input
          type="email"
          name="email"
          autocomplete="email"
          inputmode="email"
          placeholder="tu@correo.com"
          [(ngModel)]="email">
      </label>

      <div class="fb-field">
        <label class="fb-label" for="clave-nueva">Contraseña</label>
        <div class="password">
          <input
            id="clave-nueva"
            name="password"
            autocomplete="new-password"
            placeholder="Mínimo 6 caracteres"
            [type]="verClave ? 'text' : 'password'"
            [(ngModel)]="password">
          <button
            type="button"
            class="fb-icon-btn plain sm"
            (click)="verClave = !verClave"
            [attr.aria-label]="verClave ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <ion-icon [name]="verClave ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
      </div>

      <p class="error" *ngIf="error" role="alert">
        <ion-icon name="alert-circle-outline" aria-hidden="true"></ion-icon>
        {{ error }}
      </p>

      <button type="submit" class="fb-btn primary big block" [disabled]="loading">
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        <span>{{ loading ? 'Creando…' : 'Crear cuenta' }}</span>
      </button>

      <p class="alt">
        ¿Ya tienes cuenta?
        <button type="button" class="fb-link" (click)="goLogin()">Iniciar sesión</button>
      </p>
    </form>

  </main>
</ion-content>
