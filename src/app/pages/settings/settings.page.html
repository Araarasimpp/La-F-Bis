<ion-content>
  <div class="fb-page narrow">

    <header class="fb-header">
      <div>
        <h1 class="fb-title">Configuración</h1>
        <span class="fb-sub">Tu perfil y el comportamiento de la caja</span>
      </div>
    </header>

    <section class="fb-card block">
      <h2 class="fb-eyebrow">Perfil</h2>

      <div class="avatar-row">
        <span class="fb-avatar lg">
          <img *ngIf="profile.avatar_url; else ini" [src]="profile.avatar_url" alt="">
          <ng-template #ini>{{ profile.username?.charAt(0)?.toUpperCase() || '?' }}</ng-template>
        </span>
        <label class="fb-btn ghost upload">
          <ion-spinner *ngIf="subiendo" name="crescent"></ion-spinner>
          <ion-icon *ngIf="!subiendo" name="cloud-upload-outline" aria-hidden="true"></ion-icon>
          {{ subiendo ? 'Subiendo…' : 'Cambiar foto' }}
          <input type="file" accept="image/*" class="fb-sr" (change)="onAvatarSelected($event)">
        </label>
      </div>

      <label class="fb-field">
        <span>Nombre de usuario</span>
        <input type="text" autocomplete="username" [(ngModel)]="profile.username" (input)="guardado = false">
      </label>

      <label class="fb-field">
        <span>Nombre del negocio</span>
        <input type="text" placeholder="Repuestos La F Bis" [(ngModel)]="profile.nombre_negocio" (input)="guardado = false">
      </label>
    </section>

    <section class="fb-card block">
      <h2 class="fb-eyebrow">Caja</h2>

      <label class="switch-row">
        <span class="switch-text">
          <strong>Imprimir ticket automáticamente</strong>
          <span>Al terminar una venta en el computador abre la impresión del ticket.</span>
        </span>
        <input type="checkbox" class="fb-switch" [(ngModel)]="settings.ticket_auto" (change)="guardado = false">
      </label>
    </section>

    <section class="fb-card block">
      <h2 class="fb-eyebrow">Inventario</h2>

      <div class="switch-row">
        <span class="switch-text">
          <strong>Avisar cuando queden</strong>
          <span>Los productos con esta cantidad o menos se marcan "por reponer" en Inventario y en Vender.</span>
        </span>
        <div class="fb-stepper">
          <button type="button" (click)="cambiarStockMinimo(-1)" aria-label="Avisar con una unidad menos">
            <ion-icon name="remove-outline"></ion-icon>
          </button>
          <span class="qty" aria-live="polite">{{ settings.stock_minimo }}</span>
          <button type="button" class="plus" (click)="cambiarStockMinimo(1)" aria-label="Avisar con una unidad más">
            <ion-icon name="add-outline"></ion-icon>
          </button>
        </div>
      </div>
    </section>

    <button type="button" class="fb-btn primary big block" (click)="guardar()" [disabled]="loading">
      <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
      <ion-icon *ngIf="guardado && !loading" name="checkmark-outline" aria-hidden="true"></ion-icon>
      {{ loading ? 'Guardando…' : guardado ? 'Cambios guardados' : 'Guardar cambios' }}
    </button>
  </div>
</ion-content>
