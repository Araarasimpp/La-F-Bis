<ion-content>
  <div class="layout">
    
    <div class="main">

      <div class="topbar">
        <ion-menu-button></ion-menu-button>
      </div>

      <div class="bar">
        <div class="titulo-seccion">
          <h1>Usuarios</h1>
          <p>Administración del sistema</p>
        </div>

        <div class="group-busqueda">
          <ion-icon class="icon" name="search-outline"></ion-icon>
          <input
            type="text"
            class="filtrar"
            placeholder="Buscar usuario..."
            [(ngModel)]="busqueda">
        </div>    
      </div>

      <div *ngIf="cargando" class="loading">
        <ion-spinner name="crescent" color="primary"></ion-spinner>
      </div>

      <div class="users-grid">

        <div class="user-card" *ngFor="let u of usuariosFiltrados">

          <div class="card-top">
            <div class="avatar-wrapper">
              <img
                *ngIf="u.avatar_url"
                [src]="u.avatar_url"
                class="avatar">

              <div
                *ngIf="!u.avatar_url"
                class="avatar empty">
                {{ u.username?.charAt(0)?.toUpperCase() || '?' }}
              </div>
            </div>

            <div class="user-info">
              <h2>{{ u.username || 'Sin nombre' }}</h2>
              <p class="user-id">ID: {{ u.id }}</p>
            </div>
          </div>

          <div class="status-row">
            <div
              class="badge"
              [class.active]="u.activo"
              [class.inactive]="!u.activo">
              {{ u.activo ? 'Activo' : 'Suspendido' }}
            </div>
          </div>

          <div class="field">
            <label>Rol del usuario</label>
            <div class="select-wrapper">
              <select [(ngModel)]="u.rol" (change)="cambiarRol(u)">
                <option value="administrador">Administrador</option>
                <option value="vendedor">Vendedor</option>
                <option value="inventario">Inventario</option>
                <option value="supervisor">Supervisor</option>
              </select>
            </div>
          </div>

          <div class="created">
            <span>Creado:</span> {{ u.created_at | date:'shortDate' }}
          </div>

          <button
            class="toggle-btn"
            [class.disabled]="!u.activo"
            (click)="toggleActivo(u)">
            {{ u.activo ? 'Suspender Usuario' : 'Activar Usuario' }}
          </button>

        </div>

      </div>

    </div>
  </div>
</ion-content>
