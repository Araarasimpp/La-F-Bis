<ion-content>
  <main class="auth">

    <div class="stripe" aria-hidden="true"></div>

    <section class="brand">
      <span class="fb-eyebrow">Repuestos · Taller</span>
      <h1>La F<br>Bis</h1>
      <p>Inventario, ventas y órdenes de taller en un solo lugar.</p>
    </section>

    <form class="form" (ngSubmit)="login()" novalidate>

      <label class="fb-field">
        <span>Correo</span>
        <input
          type="email"
          name="email"
          autocomplete="email"
          inputmode="email"
          placeholder="tu@correo.com"
          [(ngModel)]="email">
      </label>

      <div class="fb-field">
        <label class="fb-label" for="clave">Contraseña</label>
        <div class="password">
          <input
            id="clave"
            name="password"
            autocomplete="current-password"
            placeholder="••••••••"
            [type]="verClave ? 'text' : 'password'"
            [(ngModel)]="password">
          <button
            type="button"
            class="fb-icon-btn plain sm"
            (click)="verClave = !verClave"
            [attr.aria-label]="verClave ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <ion-icon [name]="verClave ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
      </div>

      <p class="error" *ngIf="error" role="alert">
        <ion-icon name="alert-circle-outline" aria-hidden="true"></ion-icon>
        {{ error }}
      </p>

      <button type="submit" class="fb-btn primary big block" [disabled]="loading">
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        <span>{{ loading ? 'Ingresando…' : 'Ingresar' }}</span>
      </button>

      <p class="alt">
        ¿No tienes cuenta?
        <button type="button" class="fb-link" (click)="goRegister()">Crear cuenta</button>
      </p>
    </form>

  </main>
</ion-content>
